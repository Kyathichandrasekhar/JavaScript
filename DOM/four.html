<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: aliceblue;">
    <ul class="language">
        <li>This is a HTML language writen by the HTML code</li>
    </ul>
</body>
<script>
    function addlanguage(langName) {
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addlanguage("Java")
    addlanguage("Python")

    function OpimizewayLanguage(langName) {
        const li = document.createElement('li')
        const addText = document.createTextNode(langName)
        li.appendChild(addText)
        document.querySelector('.language').appendChild(li)
    }
    OpimizewayLanguage("C++")
    OpimizewayLanguage("JavaScript")

    //Edit 
    // slecting elements to edit 
    const secondlang = document.querySelector("li:nth-child(2)")
    // secondlang.innerHTML = "React" //it is not that optimized for the large projects

    //optimized approach to edit 
    const newli = document.createElement('li')
    newli.textContent = "Express"
    secondlang.replaceWith(newli)

    //Edit outerHTML
    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = '<li>TypeScript</li>'

    //remove
    const Lastlang = document.querySelector('li:last-child')
    Lastlang.remove()
</script>
</html>
